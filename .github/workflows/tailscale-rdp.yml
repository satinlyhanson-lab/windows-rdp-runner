name: Windows 11 RDP with Tailscale

on:
  workflow_dispatch:
    inputs:
      rdp_password:
        description: 'Custom RDP Password (optional)'
        required: false
        default: 'P@ssw0rd123!'
        type: string
      proxy_url:
        description: 'Proxy URL for Google Chrome (optional)'
        required: false
        default: ''
        type: string



env:
  TAILSCALE_AUTH_TOKEN: ${{ secrets.TAILSCALE_AUTH_TOKEN }}
  RDP_USER: runneradmin
  RDP_PASS: ${{ inputs.rdp_password }}

jobs:
  windows-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download Tailscale
      run: |
        Write-Host "Downloading Tailscale..."
        Invoke-WebRequest https://pkgs.tailscale.com/stable/tailscale-setup-1.62.0.exe -OutFile tailscale-setup.exe
        Write-Host "Download completed"
      shell: powershell

    - name: Install Tailscale
      run: |
        Write-Host "Installing Tailscale..."
        .\tailscale-setup.exe /install /quiet
        Start-Sleep -Seconds 30  # Wait for installation
        Write-Host "Installation completed"
      shell: powershell

    - name: Authenticate Tailscale
      run: |
        Write-Host "Authenticating with Tailscale..."
        # Add Tailscale to PATH
        $env:PATH = "$env:PATH;C:\Program Files\Tailscale"
        
        # Connect to Tailscale network
        & "C:\Program Files\Tailscale\tailscale.exe" up --authkey $env:TAILSCALE_AUTH_TOKEN --hostname "rdp-${{ github.run_id }}" --accept-routes
        
        Write-Host "Tailscale connection established"
      shell: powershell
      env:
        TAILSCALE_AUTH_TOKEN: ${{ secrets.TAILSCALE_AUTH_TOKEN }}

    - name: Enable Remote Desktop
      run: |
        Write-Host "Enabling Remote Desktop..."
        # Enable Terminal Services
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        
        # Enable Remote Desktop through Windows Firewall
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        
        # Enable Network Level Authentication
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
        
        # Set RDP password for runneradmin user
        Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "$env:RDP_PASS" -Force)
        
        Write-Host "Remote Desktop enabled successfully"
        Write-Host "Username: $env:RDP_USER"
        Write-Host "Password: $env:RDP_PASS"
      shell: powershell

    - name: Start Chrome with CDP
      run: |
        Write-Host "Killing any existing Chrome processes..."
        Stop-Process -Name "chrome" -ErrorAction SilentlyContinue
        Start-Sleep -Seconds 2
        
        Write-Host "Opening Firewall for CDP port 9222..."
        Remove-NetFirewallRule -DisplayName "Chrome CDP" -ErrorAction SilentlyContinue
        New-NetFirewallRule -DisplayName "Chrome CDP" -Direction Inbound -LocalPort 9222 -Protocol TCP -Action Allow -Profile Any
        
        # Prepare Chrome Arguments
        $chromeArgs = @(
            "--remote-debugging-port=9222",
            "--remote-debugging-address=127.0.0.1",
            "--no-first-run",
            "--no-default-browser-check",
            "--no-sandbox",
            "--disable-blink-features=AutomationControlled",
            "--user-data-dir=C:\chrome_dev_profile"
        )
        
        $proxyUrl = "${{ inputs.proxy_url }}"
        if ($proxyUrl) {
            Write-Host "Proxy URL provided: $proxyUrl"
            $cleanUrl = $proxyUrl -replace "http://", "" -replace "https://", ""
            
            $proxyHost = ""
            $proxyPort = ""
            $proxyUser = ""
            $proxyPass = ""
            
            if ($cleanUrl -like "*@*") {
                $parts = $cleanUrl.Split("@")
                $authPart = $parts[0]
                $serverPart = $parts[1]
                
                $authParts = $authPart.Split(":")
                $proxyUser = $authParts[0]
                $proxyPass = $authParts[1]
                
                $serverParts = $serverPart.Split(":")
                $proxyHost = $serverParts[0]
                $proxyPort = $serverParts[1]
            } else {
                $parts = $cleanUrl.Split(":")
                if ($parts.Length -eq 4) {
                    $proxyHost = $parts[0]
                    $proxyPort = $parts[1]
                    $proxyUser = $parts[2]
                    $proxyPass = $parts[3]
                } elseif ($parts.Length -eq 2) {
                    $proxyHost = $parts[0]
                    $proxyPort = $parts[1]
                }
            }
            
            if ($proxyUser -and $proxyPass) {
                Write-Host "Configuring authenticated proxy extension: ${proxyHost}:$proxyPort"
                
                $extDir = "C:\proxy_extension"
                New-Item -ItemType Directory -Force -Path $extDir | Out-Null
                
                $manifestJson = '{"version":"1.0.0","manifest_version":2,"name":"Chrome Proxy","permissions":["proxy","tabs","unlimitedStorage","storage","<all_urls>","webRequest","webRequestBlocking"],"background":{"scripts":["background.js"]},"minimum_chrome_version":"22.0.0"}'
                $manifestJson | Out-File -FilePath "$extDir\manifest.json" -Encoding ascii -Force
                
                $backgroundJs = @(
                    "var config = {",
                    "    mode: ""fixed_servers"",",
                    "    rules: {",
                    "        singleProxy: {",
                    "            scheme: ""http"",",
                    "            host: ""$proxyHost"",",
                    "            port: parseInt($proxyPort)",
                    "        },",
                    "        bypassList: [""localhost""]",
                    "    }",
                    "};",
                    "",
                    "chrome.proxy.settings.set({value: config, scope: ""regular""}, function() {});",
                    "",
                    "function callbackFn(details) {",
                    "    return {",
                    "        authCredentials: {",
                    "            username: ""$proxyUser"",",
                    "            password: ""$proxyPass""",
                    "        }",
                    "    };",
                    "}",
                    "",
                    "chrome.webRequest.onAuthRequired.addListener(",
                    "    callbackFn,",
                    "    {urls: [""<all_urls>""]},",
                    "    [""blocking""]",
                    ");"
                ) -join "`r`n"
                $backgroundJs | Out-File -FilePath "$extDir\background.js" -Encoding ascii -Force
                
                $chromeArgs += "--load-extension=$extDir"
            } elseif ($proxyHost -and $proxyPort) {
                Write-Host "Configuring standard/unauthenticated proxy: ${proxyHost}:$proxyPort"
                $chromeArgs += "--proxy-server=${proxyHost}:$proxyPort"
            }
        }
        
        Write-Host "Starting Chrome with remote debugging..."
        $chromePath = "C:\Program Files\Google\Chrome\Application\chrome.exe"
        if (-not (Test-Path $chromePath)) {
            $chromePath = "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe"
        }
        
        if (-not (Test-Path $chromePath)) {
            Write-Warning "Google Chrome executable not found!"
        }
        
        # Prevent GitHub Actions runner from killing Chrome after this step completes
        $env:RUNNER_TRACKING_ID = $null
        
        $chromeArgsStr = $chromeArgs -join " "
        Write-Host "Chrome arguments: $chromeArgsStr"
        
        Start-Process -FilePath $chromePath -ArgumentList $chromeArgs -RedirectStandardOutput "C:\chrome_stdout.log" -RedirectStandardError "C:\chrome_stderr.log"
        
        Write-Host "Chrome started on localhost:9222"
        
        Write-Host "Setting up Tailscale port forward for CDP..."
        $env:PATH = "$env:PATH;C:\Program Files\Tailscale"
        $serveJob = Start-Job -ScriptBlock { & "C:\Program Files\Tailscale\tailscale.exe" serve --tcp 9222 tcp://localhost:9222 2>&1 }
if (Wait-Job $serveJob -Timeout 45) { Receive-Job $serveJob | Out-Null } else { Write-Warning "tailscale serve timed out; continuing without CDP forward"; Stop-Job $serveJob }
Remove-Job $serveJob -Force -ErrorAction SilentlyContinue
        Write-Host "Tailscale port forward configured"
      shell: powershell

    - name: Get Tailscale IP and Display Connection Info
      run: |
        Write-Host "Getting Tailscale IP address..."
        
        # Add Tailscale to PATH
        $env:PATH = "$env:PATH;C:\Program Files\Tailscale"
        
        # Get Tailscale IP
        $tailscaleIP = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
        
        $connectionInfo = @"
        ==========================================
        🚀 TAILSCALE RDP CONNECTION ESTABLISHED!
        ==========================================
        Tailscale IP: $tailscaleIP
        Username: $env:RDP_USER
        Password: $env:RDP_PASS
        ==========================================
        
        How to connect:
        1. Install Tailscale on your device from tailscale.com
        2. Login with the same account you used for this setup
        3. Open Remote Desktop Connection
        4. Connect to: $tailscaleIP
        5. Use the credentials above
        
        Session will remain active for up to 6 hours.
        Your RDP is now securely accessible via Tailscale VPN!
        ==========================================
        "@
        
        Write-Host $connectionInfo
        
        # Save to file for reference
        $connectionInfo | Out-File -FilePath "tailscale_rdp_info.txt" -Encoding UTF8
      shell: powershell

    - name: Display System Information
      run: |
        Write-Host "=== System Information ==="
        Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, TotalPhysicalMemory, CsProcessors | Format-List
        
        Write-Host "=== Network Configuration ==="
        Get-NetIPAddress -AddressFamily IPv4 | Where-Object {$_.InterfaceAlias -notmatch "Loopback"} | Format-Table
        
        Write-Host "=== Chrome Process Status ==="
        Get-Process -Name "chrome" -ErrorAction SilentlyContinue | Select-Object Id, ProcessName | Format-Table
        
        Write-Host "=== Port 9222 Bindings ==="
        Get-NetTCPConnection -LocalPort 9222 -ErrorAction SilentlyContinue | Format-Table
        
        Write-Host "=== Chrome Output Logs ==="
        if (Test-Path "C:\chrome_stdout.log") {
            Write-Host "--- stdout ---"
            Get-Content "C:\chrome_stdout.log" -Tail 20
        }
        if (Test-Path "C:\chrome_stderr.log") {
            Write-Host "--- stderr ---"
            Get-Content "C:\chrome_stderr.log" -Tail 20
        }
        
        Write-Host "=== Tailscale Status ==="
        $env:PATH = "$env:PATH;C:\Program Files\Tailscale"
        & "C:\Program Files\Tailscale\tailscale.exe" status
        Write-Host "=== Tailscale Serve Status ==="
        & "C:\Program Files\Tailscale\tailscale.exe" serve status
        
        Write-Host "=== Available Software ==="
        Write-Host "- Google Chrome"
        Write-Host "- Microsoft Edge"
        Write-Host "- Visual Studio Code"
        Write-Host "- Git"
        Write-Host "- Node.js"
        Write-Host "- Python"
        Write-Host "- PowerShell 7"
        Write-Host "- Windows Terminal"
      shell: powershell

    - name: Keep Session Alive
      run: |
        Write-Host "Keeping Tailscale RDP session alive..."
        Write-Host "This workflow will run for up to 6 hours."
        Write-Host "You can cancel the workflow to stop the RDP session."
        Write-Host ""
        Write-Host "Current time: $(Get-Date)"
        Write-Host "Session will automatically end at: $((Get-Date).AddHours(6))"
        
        # Keep the session alive by running a loop
        $endTime = (Get-Date).AddHours(6)
        while ((Get-Date) -lt $endTime) {
            Write-Host "Tailscale RDP active - $(Get-Date) - Time remaining: $(($endTime - (Get-Date)).ToString('hh\:mm\:ss'))"
            
            # Check Tailscale status every 5 minutes
            $env:PATH = "$env:PATH;C:\Program Files\Tailscale"
            $tailscaleStatus = & "C:\Program Files\Tailscale\tailscale.exe" status --json 2>$null
            if ($tailscaleStatus) {
                Write-Host "Tailscale connection healthy"
            } else {
                Write-Host "Warning: Tailscale connection issue detected"
            }
            
            Start-Sleep -Seconds 300  # Check every 5 minutes
        }
        
        Write-Host "Session timeout reached. Ending Tailscale RDP session."
      shell: powershell
